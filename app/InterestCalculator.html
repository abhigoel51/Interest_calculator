<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interest Calculator</title>
<style>
:root{
  --page:#f7f7f5; --surface:#fff; --line:#e6e4df; --line-strong:#d4d1ca;
  --ink:#1c1c1a; --muted:#6b6860; --accent:#1f4d3a; --accent-hover:#183c2d;
  --focus:rgba(31,77,58,.28); --good:#1d6b43; --warn:#8a5a00; --bad:#a3321f;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--page);color:var(--ink);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1360px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em;margin-right:auto}
.menu-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(28,28,26,.08);z-index:20;min-width:260px;padding:8px}
.pop .item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.pop .item:hover{background:#f3f2ee}
.pop .item.current{font-weight:600}
.pop .item small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.pop .empty{padding:10px 12px;color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .danger{color:var(--bad)}
.pop .muted-red{color:#a2503f}
.mbox .row.split{justify-content:space-between;flex-wrap:wrap}
.mbox .row .grp{display:flex;gap:12px;flex-wrap:wrap}
.psum{margin:0 0 18px;color:var(--muted);font-size:15px}
.psum b{color:var(--ink);font-weight:600}
.hbar select{width:auto;min-width:230px}
.ptbl tbody tr.prow{cursor:pointer;border-top:1px solid var(--line)}
.ptbl tbody tr.prow:hover{background:#f7f6f2}
.ptbl tbody tr.prow.current{background:#f1efe8}
.ptbl tbody tr.prow:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--focus)}
.ptbl td small.pay{display:inline;margin-left:6px}
.ptbl th.r{text-align:right}

/* layout */
main{max-width:1360px;margin:0 auto;padding:32px 24px 64px;display:grid;grid-template-columns:1fr;gap:32px;align-items:start}
#mainwrap{container-type:inline-size}
/* two columns only when the page itself is wide enough for the loans list (also correct under browser zoom) */
@container (min-width:1320px){main{grid-template-columns:minmax(0,1fr) 560px;column-gap:24px}.result-col{position:sticky;top:24px}}
@supports not (container-type:inline-size){@media(min-width:1320px){main{grid-template-columns:minmax(0,1fr) 560px;column-gap:24px}.result-col{position:sticky;top:24px}}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(28,28,26,.04)}
.sec{padding:24px 28px}
.sec+.sec{margin-top:16px}
.sec h2{margin:0 0 16px;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;background:var(--accent);border-radius:50%;font-size:13px;font-weight:600;letter-spacing:0;color:#fff}
.sec h2 .aux{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}

/* fields */
label.f{display:block;font-size:15px;color:var(--muted);font-weight:500}
label.f>span.lbl{display:block;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);
  border-radius:8px;background:#fff;color:var(--ink);font-size:17px}
select{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,#6b6860 50%),linear-gradient(135deg,#6b6860 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
input.bad{border-color:var(--bad)}
.hint{font-size:14px;color:var(--bad);position:absolute;left:0;top:100%;margin-top:2px;white-space:nowrap}
label.f{position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.datebox{position:relative;display:block}
.datebox input[type=text]{padding-right:44px}
.cal{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.cal:hover{background:#f3f2ee;color:var(--ink)}
.cal[aria-expanded=true]{background:#f3f2ee;color:var(--ink)}
.calpop{position:absolute;z-index:40;width:360px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(28,28,26,.14),0 2px 6px rgba(28,28,26,.06);padding:12px}
.calhead{display:grid;grid-template-columns:44px minmax(0,1fr) 92px 44px;gap:6px;align-items:center;margin-bottom:8px}
.calhead select{height:44px;padding-left:10px;font-size:16px}
.calnav{height:44px;width:44px;border:1px solid var(--line-strong);background:#fff;border-radius:8px;cursor:pointer;font-size:22px;line-height:1;color:var(--ink);display:grid;place-items:center;padding:0}
.calnav:hover{background:#f3f2ee}
.calwd,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calwd span{text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0 6px;letter-spacing:.02em}
.calgrid{grid-auto-rows:44px}
.calday{height:44px;width:100%;min-width:44px;border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.calday:hover{background:#eef3f0}
.calday.today{border-color:var(--accent)}
.calday.sel,.calday.sel:hover{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.calday:focus-visible,.calnav:focus-visible,.calfoot .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
.calfoot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.calfoot .btn{height:44px;color:var(--accent);font-weight:600}
details.more{margin-top:20px}
details.more summary{cursor:pointer;color:var(--muted);font-size:15px;list-style:none;display:inline-block;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"\2212  "}
details.more .body{margin-top:12px;max-width:50%}
@media(max-width:640px){details.more .body{max-width:none}}

/* buttons */
.btn{height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f3f2ee}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink)}
.btn.ghost:hover{background:#f3f2ee}
.namenote{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--surface);padding:12px 14px}
.namenote p{margin:0 0 10px}
.namenote .nacts{display:flex;flex-wrap:wrap;gap:8px}
.np-dim{opacity:.45}
.duphint{margin-top:10px;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0 2px;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.namesaved{margin-top:10px;font-size:15px;color:var(--muted)}
.btn.sm{height:38px;padding:0 14px;font-size:15px}
.btn:focus-visible,.item:focus-visible,.cal:focus-visible,summary:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}

/* loans: entry form + compact list */
.lform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.3fr);gap:12px 12px;align-items:start;padding-bottom:20px;border-bottom:1px solid var(--line-strong)}
.lform .note{grid-column:1 / span 2}
.lform .acts{display:flex;align-items:center;gap:12px;height:44px;align-self:end}
.lform .acts .btn.primary{min-width:96px}
.lform.editing{background:#f4f8f5;margin:-8px -12px 0;padding:8px 12px 20px;border-radius:8px}
.cancel{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:6px 4px}
.cancel:hover{color:var(--ink)}
.cancel:focus-visible,.lact .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
.ferr{display:block;font-size:14px;color:var(--bad);margin-top:4px;line-height:1.3}
.lhead,.lrow{display:grid;grid-template-columns:84px minmax(0,1fr) 106px 106px 126px 96px;column-gap:8px;align-items:center}
.lhead{padding:14px 0 6px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.lhead .r{text-align:right}
.lrow{padding:6px 0;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.lhead+.lrow{border-top-color:var(--line-strong)}
.lrow .ld{color:var(--muted);white-space:nowrap}
.lrow .lt{min-width:0;overflow-wrap:anywhere}
.lrow .lt .ln{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.lrow.rep .num{color:var(--good)}
.lrow .lmsg{grid-column:span 3;text-align:right;color:var(--warn);font-size:14px;line-height:1.3}
.lrow .lmsg.lmsg2{grid-column:span 2}
.lrow.editing{background:#f4f8f5;box-shadow:inset 3px 0 0 var(--accent);margin:0 -8px;padding-left:8px;padding-right:8px}
.lact{display:flex;gap:0;justify-content:flex-end;align-items:center}
.lact .btn{height:32px;padding:0 6px;font-size:14px;color:var(--muted)}
.lact .btn:hover{color:var(--ink)}
.lact .btn.danger:hover{background:#f6e9e6;color:var(--bad)}
.lrow.confirming .lact{grid-column:1 / -1;padding:6px 0 4px;gap:10px}
.lrow.confirming .lact .ask{margin-right:4px;font-size:15px}
.lact .btn.yes{background:var(--bad);border-color:var(--bad);color:#fff;height:36px;padding:0 14px;font-size:15px}
.lact .btn.yes:hover{background:#862a1a}
.lact .btn.no{height:36px;padding:0 14px;font-size:15px;color:var(--ink);border-color:var(--line-strong)}
.empty-note{color:var(--muted);padding:16px 0 0}
@media(max-width:700px){
  .lform{grid-template-columns:1fr 1fr}.lform .type{grid-column:1 / -1}.lform .note{grid-column:1 / -1}
  .lhead{display:none}
  .lrow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:2px;padding:10px 0}
  .lrow .lt{grid-column:span 2}.lrow .lmsg,.lrow .lmsg.lmsg2{grid-column:1 / -1;text-align:left}
  .lrow .lact{grid-column:1 / -1}
}

/* in-page confirm modal */
.modal{position:fixed;inset:0;background:rgba(28,28,26,.28);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(28,28,26,.14)}
.mbox h3{margin:0 0 8px;font-size:18px}
.mbox p{margin:0;color:var(--muted)}
.mbox .row{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-fill:hover{background:#862a1a}

/* result */
.result{padding:28px 18px}
.result .who{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.result .meta{color:var(--muted);font-size:15px;margin:2px 0 20px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13.5px;font-weight:600;color:var(--muted);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--line-strong);letter-spacing:.02em}
th.r{text-align:right}
td{padding:12px 0;border-bottom:1px solid var(--line);vertical-align:top}
td+td,th+th{padding-left:6px}
td.sub{color:var(--muted);white-space:nowrap}
tr.rep td.num{color:var(--good)}
tr.flag td.msg{color:var(--warn);font-size:14.5px;text-align:right}
.type small{display:block;color:var(--muted);font-size:13px;line-height:1.3;overflow-wrap:break-word}
.none{color:var(--muted);padding:20px 0}
.totals{margin-top:20px}
.trow{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted)}
.trow b{font-weight:500;color:var(--ink)}
.due{margin-top:12px;padding-top:20px;border-top:1px solid var(--line-strong);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.due .label{font-weight:500}
.due .amt{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.due .amt .cur{font-weight:400;color:var(--muted);margin-right:4px}
.actions{margin-top:24px;display:flex;gap:12px}
.printonly{display:none}
.warnbar{max-width:1360px;margin:12px auto 0;padding:10px 24px;color:var(--warn)}

/* print history */
.hview{max-width:1360px;margin:0 auto;padding:32px 24px 64px}
.hcard{padding:24px 28px}
.hbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hbar h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hbar .grow{flex:1 1 auto}
.hbar input[type=text]{width:280px;max-width:100%}
.hback{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 4px;border-radius:6px}
.hback:hover{text-decoration:underline}
.hback:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
.htbl{width:100%;border-collapse:collapse;font-size:15px}
.htbl th{padding:0 0 10px;white-space:nowrap}
.htbl td{padding:12px 0;vertical-align:middle}
.htbl td+td,.htbl th+th{padding-left:14px}
.htbl td.nm{overflow-wrap:anywhere}
.htbl td small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.htbl td.sub{white-space:nowrap}
.htbl td.hact{text-align:right;white-space:nowrap}
.htbl td.hconf{text-align:right}
.htbl td.hconf .ask{margin-right:12px}
.htbl td.hconf .btn+.btn{margin-left:8px}
.htbl .btn.yes{background:var(--bad);border-color:var(--bad);color:#fff;height:36px;padding:0 14px;font-size:15px}
.htbl .btn.no{height:36px;padding:0 14px;font-size:15px;border-color:var(--line-strong)}
.htbl .btn.ghost{height:32px;padding:0 8px;font-size:14px;color:var(--muted)}
.htbl .btn.ghost.danger:hover{background:#f6e9e6;color:var(--bad)}
.hempty{color:var(--muted);padding:24px 0 8px}
.lastp{margin-top:10px;font-size:14px;color:var(--muted)}
.hscroll{overflow-x:auto}

/* print area (hidden on screen) */
.printarea{display:none}
.pa-pt{font-size:22px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.pa-name{font-size:18px;font-weight:600}
.pa-phone{color:#000;margin-top:2px}
.pa-meta{margin-top:6px}
.pa-tbl{margin-top:20px}
.pa-plist{width:100%;border-collapse:collapse}
.pa-plist th{text-align:left;font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid #000}
.pa-plist th.r,.pa-plist td.num{text-align:right;padding-right:0}
.pa-plist td{padding:6px 8px 6px 0;border-bottom:1px solid #bbb;vertical-align:top}
.pa-plist td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.pa-note{color:#444;font-size:.92em;margin-left:6px}
.pa-tot{margin-top:24px;border-top:1px solid #000;padding-top:10px}
.pa-tot .trow{padding:5px 0;color:#000}
.pa-due{margin-top:8px;padding-top:12px;border-top:1px solid #000;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.pa-due .amt{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pa-foot{margin-top:36px;font-size:11px;color:#444}
.printopt{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer;min-height:44px}
.printopt input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}

/* print */
@page{size:A4 portrait;margin:18mm}
@media print{
  html{font-size:14px}
  body{background:#fff;color:#000}
  .topbar,.noprint,.warnbar,.modal,.calpop,#mainwrap,.hview{display:none!important}
  .printarea{display:block}
  table{font-size:13px}
  th{color:#000;border-bottom:1px solid #000}
  td{border-bottom:1px solid #999}
  td.sub{color:#000}
  tr.rep td.num{color:#000}
  .type small{color:#000}
}
</style>
</head>
<body>
<header class="topbar noprint"><div class="topbar-in">
  <div class="brand">Interest Calculator</div>
  <div class="menu-wrap">
    <button class="btn" id="peopleBtn" data-testid="people-btn">People</button>
  </div>
  <button class="btn" id="historyBtn" data-testid="history-btn">History</button>
  <button class="btn primary" id="newPerson" data-testid="new-person">+ New person</button>
  <div class="menu-wrap">
    <button class="btn ghost" id="menuBtn" data-testid="menu-more" aria-haspopup="true" aria-expanded="false" aria-label="More">More</button>
    <div class="pop" id="menuPop" hidden>
      <button class="item" id="backupBtn">Backup all data</button>
      <button class="item" id="restoreBtn">Restore from backup</button>
      <hr>
      <button class="item danger" id="delPerson">Delete this person</button>
      <hr>
      <button class="item danger muted-red" id="startFresh" data-testid="start-fresh">Start fresh (delete everything)</button>
    </div>
  </div>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
</div></header>
<div class="warnbar noprint" id="storageWarn" hidden>Saving is not available in this browser, so changes will be lost when you close the page. Use Backup to keep a copy.</div>

<div id="mainwrap"><main>
  <div class="form-col noprint">
    <section class="card sec">
      <h2><span class="n">1</span>Person</h2>
      <div class="grid2">
        <label class="f"><span class="lbl">Name</span><input type="text" id="pname" data-testid="person-name" autocomplete="off" placeholder="Full name"></label>
        <label class="f"><span class="lbl">Phone or notes (optional)</span><input type="text" id="pphone" data-testid="person-phone" autocomplete="off"></label>
      </div>
      <div id="dupHintSlot" aria-live="polite"></div>
      <div id="nameNoteSlot" aria-live="polite"></div>
    </section>

    <section class="card sec">
      <h2><span class="n">2</span>Interest terms</h2>
      <div class="grid3">
        <label class="f"><span class="lbl">Calculate up to</span>
          <span class="datebox"><input type="text" id="calcDate" data-testid="calc-date" inputmode="numeric" placeholder="dd-mm-yyyy" autocomplete="off">
          <button type="button" class="cal" data-testid="cal-btn" aria-label="Pick date from calendar" aria-haspopup="dialog" aria-expanded="false" data-for="calcDate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button></span>
          <div class="hint" id="calcHint"></div></label>
        <label class="f"><span class="lbl">Interest per month (%)</span><input type="text" id="roi" data-testid="roi" inputmode="decimal" autocomplete="off"></label>
        <label class="f"><span class="lbl">Add interest to principal every (months)</span><input type="text" id="comp" data-testid="comp" inputmode="decimal" autocomplete="off"></label>
      </div>
      <details class="more"><summary>More options</summary>
        <div class="body"><label class="f"><span class="lbl">Allowance (months)</span><input type="text" id="approx" data-testid="approx" inputmode="decimal" autocomplete="off"></label></div>
      </details>
    </section>

    <section class="card sec">
      <h2><span class="n">3</span>Loans <span class="aux" id="loanCount"></span></h2>
      <div class="lform" id="loanForm">
        <label class="f"><span class="lbl">Date</span>
          <span class="datebox"><input type="text" id="lDate" data-testid="loan-date" inputmode="numeric" placeholder="dd-mm-yyyy" autocomplete="off">
          <button type="button" class="cal" data-testid="cal-btn" aria-label="Pick date from calendar" aria-haspopup="dialog" aria-expanded="false" data-for="lDate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button></span></label>

}

}
function computeRow(txn, settings) {
  var debit = numOrZero(txn && txn.debit), credit = numOrZero(txn && txn.credit);
  var amt = credit - debit;

  var dt = parseISO(txn && txn.date);
  if (!hasAmt && !dt) return { amt: 0, T: null, V: null, W: null, interest: 0, status: 'empty' };
  if (!dt) return { amt: amt, T: null, V: null, W: null, interest: 0, status: 'nodate' };
  var cd = parseISO(settings.calcDate);
  if (!cd) return { amt: amt, T: null, V: null, W: null, interest: 0, status: 'nodate' };
  var roi = Number(settings.roi), comp = Number(settings.comp), approx = Number(settings.approx) || 0;
  var T = (cd.y - dt.y) * 12 + (cd.m - dt.m) + (cd.d - dt.d) / 30;

  if (T === 0) return { amt: amt, T: 0, V: 0, W: 0, interest: 0, status: 'ok' };

  return { amt: amt, T: T, V: V, W: W, interest: interest, status: 'ok' };
}

  for (var i = 0; i < txns.length; i++) {

    rows.push(r);

    function onKey(ev) { if (ev.key === 'Escape') { ev.stopPropagation(); close(); } }
    document.addEventListener('keydown', onKey, true);
    m.addEventListener('click', function (ev) {
      if (ev.target === m) { close(); return; }
      var b = ev.target.closest('button'); if (!b) return;
      var t = b.getAttribute('data-testid');
      if (t === 'fresh-backup') { $('backupBtn').onclick(); return; }
      if (t === 'fresh-cancel') { close(); return; }
      if (t === 'fresh-confirm') {
        m.remove(); document.removeEventListener('keydown', onKey, true);
        var n = newPerson();
        state = { version: 2, initialized: true, currentId: n.id, last: { roi: 1.25, comp: 6 }, people: [n], history: [] };
        hDel = null; pRes = null; save(); showView('main'); renderForm(); $('pname').focus();
      }
    });
    m.querySelector('[data-testid="fresh-cancel"]').focus();
  };

  /* ---------- backup / restore ---------- */
  $('backupBtn').onclick = function () {
    closePops();
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'interest-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
  $('restoreBtn').onclick = function () { closePops(); $('restoreFile').click(); };
  $('restoreFile').onchange = function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var s = null;
      try {
        var j = JSON.parse(rd.result);
        s = Array.isArray(j.accounts) ? normalise(migrateV1(j)) : normalise(j);
      } catch (e) {}
      if (!s) { askModal('Not a valid backup', 'That file is not a valid backup, so nothing was changed.'); return; }
      askModal('Restore this backup?', 'This replaces everything in the app with the backup. Current data will be lost.', 'Yes, restore', function () {
        state = s; save(); hDel = null; pRes = null; renderForm(); if (!$('historyView').hidden) renderHistory(); if (!$('peopleView').hidden) renderPeople();
      }, true);
    };
    rd.readAsText(f);
  };

  /* ---------- form events ---------- */
  function hint(input, msg) {
    input.classList.toggle('bad', !!msg);
    var h = input.closest('label') && input.closest('label').querySelector('.hint');
    if (h) h.textContent = msg || '';
  }
  function numField(id, key, min, minExclusive) {
    $(id).addEventListener('input', function () {
      var v = parseMoney(this.value), p = cur();
      var ok = v !== null && !isNaN(v) && (minExclusive ? v > min : v >= min);
      this.classList.toggle('bad', !ok);
      if (ok) {
        p[key] = v;
        if (key === 'roi' || key === 'comp') state.last[key] = v;
        save(); renderResult();
      }
    });
  }
  numField('roi', 'roi', 0, false); numField('comp', 'comp', 0, true); numField('approx', 'approx', 0, false);
  /* v10: a name change on a person WITH entries is pending (never stored) until the user decides */
  var nameSuppress = false, nameShown = false, savedTimer = null;
  function dimTargets() {
    var t = [document.querySelector('header.topbar'), $('storageWarn'), document.querySelector('.result-col')];
    var secs = document.querySelectorAll('.form-col .card.sec');
    for (var i = 1; i < secs.length; i++) t.push(secs[i]);
    return t;
  }
  function setPendingUI(on) {
    dimTargets().forEach(function (el) {
      if (!el) return;
      if (on) { el.setAttribute('inert', ''); el.classList.add('np-dim'); }
      else { el.removeAttribute('inert'); el.classList.remove('np-dim'); }
    });
  }
  function hideNameNote() { nameShown = false; var n = $('nameNoteSlot').querySelector('.namenote'); if (n) n.remove(); setPendingUI(false); }
  function hideSavedNote() { clearTimeout(savedTimer); var n = $('nameNoteSlot').querySelector('.namesaved'); if (n) n.remove(); }
  function norm(s) { return String(s || '').trim().toLowerCase(); }
  function findOther(name) {
    var k = norm(name); if (!k) return null;
    var me = state.currentId;
    for (var i = 0; i < state.people.length; i++) if (state.people[i].id !== me && norm(state.people[i].name) === k) return state.people[i];
    return null;
  }
  function showNameNote() {
    var p = cur(), n = p.entries.length;
    hideSavedNote(); nameShown = true;
    $('nameNoteSlot').innerHTML = '<div class="namenote" data-testid="name-change-prompt"><p>Is this a new person? ' + esc(p.name) + '’s ' +
      n + (n === 1 ? ' loan is' : ' loans are') + ' still on screen.</p><div class="nacts">' +
      '<button type="button" class="btn primary sm" data-testid="name-change-new">Start new person</button>' +
      '<button type="button" class="btn sm" data-testid="name-change-same">Same person, just correcting the name</button>' +
      '<button type="button" class="btn ghost sm" data-testid="name-change-undo">Undo</button></div></div>';
    setPendingUI(true);
  }
  function showDupNote(other) {
    var n = other.entries.length, nm = other.name.trim();
    $('nameNoteSlot').innerHTML = '<div class="namenote" data-testid="name-change-prompt"><p>' + esc(nm) + ' is already saved (' +
      n + (n === 1 ? ' loan' : ' loans') + ').</p><div class="nacts">' +
      '<button type="button" class="btn primary sm" data-testid="dup-open">Open ' + esc(nm) + '</button>' +
      '<button type="button" class="btn sm" data-testid="dup-create">Create another ' + esc(nm) + '</button>' +
      '<button type="button" class="btn ghost sm" data-testid="name-change-undo">Undo</button></div></div>';
    $('nameNoteSlot').dataset.dup = other.id;
  }
  function undoName() {
    $('pname').value = cur().name; hideNameNote(); delete $('nameNoteSlot').dataset.dup; nameSuppress = false;
    updateDupHint(); $('pname').focus();
  }
  function updateDupHint() {
    var p = cur(), o = p.entries.length === 0 ? findOther(p.name) : null, slot = $('dupHintSlot');
    slot.innerHTML = o ? '<div class="duphint" data-testid="dup-hint">Another person named ' + esc(o.name.trim()) +
      ' is already saved. <button type="button" class="linkbtn" data-testid="dup-hint-open">Open them</button></div>' : '';
  }
  window.__resetNameUI = function () { hideNameNote(); delete $('nameNoteSlot').dataset.dup; updateDupHint(); };
  function startNewPerson(typed) {
    var old = cur(), oldName = old.name;
    var np = newPerson(state.last); np.name = typed;
    state.people.push(np); state.currentId = np.id; save();
    hideNameNote(); delete $('nameNoteSlot').dataset.dup; showHistory(false); renderForm();
    var f = $('pname'); f.focus(); f.setSelectionRange(typed.length, typed.length);
    nameSuppress = false;
    $('nameNoteSlot').innerHTML = '<div class="namesaved" data-testid="name-change-saved">' + esc(oldName) + ' was saved. Find them anytime under People.</div>';
    savedTimer = setTimeout(hideSavedNote, 6000);
  }
  $('pname').addEventListener('focus', function () { if (!nameShown) nameSuppress = false; });
  $('pname').addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && nameShown) { ev.preventDefault(); ev.stopPropagation(); undoName(); } });
  $('nameNoteSlot').addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && nameShown) { ev.preventDefault(); ev.stopPropagation(); undoName(); } });
  $('nameNoteSlot').addEventListener('mousedown', function (ev) { if (ev.target.closest('button')) ev.preventDefault(); });
  $('nameNoteSlot').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var tid = b.getAttribute('data-testid'), p = cur(), typed = $('pname').value;
    if (tid === 'name-change-undo') undoName();
    else if (tid === 'name-change-same') {
      p.name = typed; save(); nameSuppress = true; hideNameNote(); renderResult(); updateDupHint(); $('pname').focus();
    } else if (tid === 'name-change-new') {
      var other = findOther(typed);
      if (other) { hideSavedNote(); showDupNote(other); } else startNewPerson(typed);
    } else if (tid === 'dup-create') startNewPerson(typed);
    else if (tid === 'dup-open') {
      var ex = null, id = $('nameNoteSlot').dataset.dup;
      state.people.forEach(function (q) { if (q.id === id) ex = q; });
      if (!ex) { undoName(); return; }
      $('pname').value = p.name; hideNameNote(); delete $('nameNoteSlot').dataset.dup;
      state.currentId = ex.id; save(); showHistory(false); renderForm();
    }
  });
  $('dupHintSlot').addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-testid="dup-hint-open"]')) return;
    var p = cur(), o = findOther(p.name); if (!o) return;
    if (p.entries.length === 0 && !p.phone.trim()) state.people = state.people.filter(function (q) { return q.id !== p.id; });
    state.currentId = o.id; save(); showHistory(false); renderForm();
  });
  $('pname').addEventListener('input', function () {
    hideSavedNote();
    var p = cur(), v = this.value;
    if (p.entries.length >= 1 && p.name.trim() !== '') {
      /* pending: never write p.name here */
      if (v === p.name) { hideNameNote(); delete $('nameNoteSlot').dataset.dup; }
      else if (!nameSuppress && !nameShown) showNameNote();
      else if ($('nameNoteSlot').dataset.dup) { delete $('nameNoteSlot').dataset.dup; showNameNote(); }
      if (v !== p.name && nameSuppress) { p.name = v; save(); renderResult(); }
      return;
    }
    p.name = v; save(); renderResult(); updateDupHint();
  });
  $('pphone').addEventListener('input', function () { cur().phone = this.value; save(); });
  $('calcDate').addEventListener('input', function () {
    var iso = dispToISO(this.value), p = cur();
    p.calcDate = iso || '';
    hint(this, this.value.trim() && !iso ? 'Type the date like 01-11-2026' : '');
    if (iso) save();
    renderResult();
  });
  function submitLoan() {
    var iso = dispToISO($('lDate').value), amt = parseMoney($('lAmount').value), ok = true;
    setErr('lDate', iso ? '' : ($('lDate').value.trim() ? 'Type the date like 10-02-2026' : 'Enter the date'));
    setErr('lAmount', amt !== null && !isNaN(amt) && amt > 0 ? '' : (amt === null ? 'Enter the amount' : 'Enter a number above zero'));
    if (!iso || amt === null || isNaN(amt) || amt <= 0) { (iso ? $('lAmount') : $('lDate')).focus(); return; }
    var p = cur();
    var entry = { date: iso, type: $('lType').value === 'repayment' ? 'repayment' : 'loan', amount: amt, note: $('lNote').value.trim() };
    if (editIdx !== null && p.entries[editIdx]) p.entries[editIdx] = entry; else p.entries.push(entry);
    sortEntries(p); delIdx = null; save();
    resetLoanForm(); renderResult(); $('lDate').focus();
  }
  $('lAdd').onclick = submitLoan;
  $('loanForm').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); submitLoan(); }
  });
  $('lDate').addEventListener('input', function () { setErr('lDate', ''); });
  $('lAmount').addEventListener('input', function () { setErr('lAmount', ''); });
  $('loanForm').addEventListener('click', function (ev) {
    if (ev.target.closest('#lCancel')) { resetLoanForm(); renderLoanList(); $('lDate').focus(); }
  });
  $('loans').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-a]'); if (!b) return;
    var row = b.closest('.lrow'), i = +row.dataset.i, p = cur(), a = b.dataset.a;
    if (a === 'edit') {
      var e = p.entries[i]; delIdx = null; clearErrs(); editIdx = i;
      $('lDate').value = isoToDisp(e.date); $('lAmount').value = e.amount == null ? '' : numStr(e.amount);
      $('lType').value = e.type; $('lNote').value = e.note || '';
      syncFormMode(); renderLoanList(); $('lDate').focus();
    } else if (a === 'del') { delIdx = i; renderLoanList(); }
    else if (a === 'no') { delIdx = null; renderLoanList(); }
    else if (a === 'yes') {
      p.entries.splice(i, 1); delIdx = null;
      if (editIdx === i) resetLoanForm(); else if (editIdx !== null && i < editIdx) editIdx--;
      save(); renderResult();
    }
  });
  /* ---------- custom calendar popover ---------- */
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var cal = null; /* { pop, field, btn, y, m, selISO } */
  function calClose(refocus) {
    if (!cal) return;
    var c = cal; cal = null;
    c.pop.remove(); c.btn.setAttribute('aria-expanded', 'false');
    window.removeEventListener('resize', calPlace);
    if (refocus) c.field.focus();
  }
  function calPlace() {
    if (!cal) return;
    var r = cal.field.closest('.datebox').getBoundingClientRect(), pop = cal.pop;
    var sx = window.pageXOffset, sy = window.pageYOffset, vw = document.documentElement.clientWidth;
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(r.left, 8), Math.max(8, vw - w - 8)) + sx;
    var top = r.bottom + 6 + sy;
    if (r.bottom + 6 + h > window.innerHeight - 8 && r.top - 6 - h >= 8) top = r.top - 6 - h + sy;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  function calGrid() {
    var c = cal, first = new Date(c.y, c.m, 1), lead = (first.getDay() + 6) % 7, days = new Date(c.y, c.m + 1, 0).getDate();
    var today = todayISO(), html = '', i;
    for (i = 0; i < lead; i++) html += '<span></span>';
    for (i = 1; i <= days; i++) {
      var iso = c.y + '-' + p2(c.m + 1) + '-' + p2(i);
      html += '<button type="button" class="calday' + (iso === c.selISO ? ' sel' : '') + (iso === today ? ' today' : '') +
        '" data-testid="cal-day" data-date="' + iso + '"' + (iso === c.selISO ? ' aria-pressed="true"' : '') + '>' + i + '</button>';
    }
    c.grid.innerHTML = html;
    c.mSel.value = String(c.m); c.ySel.value = String(c.y);
  }
  function calShift(dm) {
    var c = cal, d = new Date(c.y, c.m + dm, 1), lo = c.ySel.options[0].value, hi = c.ySel.options[c.ySel.options.length - 1].value;
    if (d.getFullYear() < +lo || d.getFullYear() > +hi) return;
    c.y = d.getFullYear(); c.m = d.getMonth(); calGrid(); calPlace();
  }
  function calOpen(btn) {
    var field = $(btn.getAttribute('data-for'));
    calClose(false);
    var iso = dispToISO(field.value), t = todayISO(), base = iso || t;
    var y = +base.slice(0, 4), m = +base.slice(5, 7) - 1;
    var y0 = Math.min(2000, y), y1 = Math.max(+t.slice(0, 4) + 5, y);
    var pop = document.createElement('div');
    pop.className = 'calpop'; pop.setAttribute('data-testid', 'cal-popover'); pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Choose a date');
    var mo = '', yo = '', k;
    for (k = 0; k < 12; k++) mo += '<option value="' + k + '">' + MONTHS[k] + '</option>';
    for (k = y0; k <= y1; k++) yo += '<option value="' + k + '">' + k + '</option>';
    pop.innerHTML = '<div class="calhead"><button type="button" class="calnav" data-a="prev" aria-label="Previous month">&#8249;</button>' +
      '<select data-testid="cal-month" aria-label="Month">' + mo + '</select><select data-testid="cal-year" aria-label="Year">' + yo + '</select>' +
      '<button type="button" class="calnav" data-a="next" aria-label="Next month">&#8250;</button></div>' +
      '<div class="calwd"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>' +
      '<div class="calgrid"></div>' +
      '<div class="calfoot"><button type="button" class="btn ghost" data-testid="cal-today" data-a="today">Today</button><button type="button" class="btn ghost" data-testid="cal-clear" data-a="clear">Clear</button></div>';
    document.body.appendChild(pop);
    cal = { pop: pop, field: field, btn: btn, y: y, m: m, selISO: iso, grid: pop.querySelector('.calgrid'),
      mSel: pop.querySelector('[data-testid="cal-month"]'), ySel: pop.querySelector('[data-testid="cal-year"]') };
    btn.setAttribute('aria-expanded', 'true');
    calGrid(); calPlace();
    window.addEventListener('resize', calPlace);
    var f = pop.querySelector('.calday.sel') || pop.querySelector('.calday.today') || pop.querySelector('.calday');
    if (f) f.focus({ preventScroll: true });
    pop.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var c = cal; if (!c) return;
      var d = ev.target.closest('.calday'), a = ev.target.closest('[data-a]');
      var pick = null;
      if (d) pick = d.getAttribute('data-date');
      else if (a) {
        var act = a.getAttribute('data-a');
        if (act === 'prev') calShift(-1); else if (act === 'next') calShift(1);
        else if (act === 'today') pick = todayISO();
        else if (act === 'clear') pick = '';
      }
      if (pick !== null) {
        var fld = c.field;
        fld.value = pick ? isoToDisp(pick) : '';
        calClose(false);
        fld.dispatchEvent(new Event('input', { bubbles: true }));
        fld.focus();
      }
    });
    pop.addEventListener('change', function (ev) {
      var c = cal; if (!c) return;
      if (ev.target === c.mSel) c.m = +c.mSel.value; else if (ev.target === c.ySel) c.y = +c.ySel.value; else return;
      calGrid(); calPlace();
    });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('button.cal');
    if (b) {
      ev.preventDefault();
      if (cal && cal.btn === b) calClose(true); else calOpen(b);
    } else if (cal && !cal.pop.contains(ev.target)) calClose(false);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && cal) { ev.stopPropagation(); calClose(true); }
  }, true);
  $('printBtn').onclick = function () { renderPrint(); recordPrint(); window.print(); };

  /* ---------- start ---------- */
  state = load();
  if (!state) { state = seed(); }
  save();
  if (!storageOK) $('storageWarn').hidden = false;
  renderForm();
})();
</script>
</body>
